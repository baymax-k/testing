x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  # The backend service has been intentionally removed from the compose
  # stack. Run the API server locally with `pnpm run dev` so you can
  # develop without rebuilding containers. The compose stack below
  # contains only the application DB and Judge0 infrastructure.

  postgres:
    image: postgres:16.2
    environment:
      POSTGRES_DB: codeethnics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeethnics"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    <<: *default-logging
    restart: unless-stopped

  server:
    image: mrkushalsm/judge0:cgv2
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - db
      - redis
    <<: *default-logging
    restart: always

  workers:
    image: mrkushalsm/judge0:cgv2
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - db
      - redis
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file:
      - judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""
    ]
    env_file:
      - judge0.conf
    ports:
      - "6379:6379"
    <<: *default-logging
    restart: always

volumes:
  data:
  postgres_data:
