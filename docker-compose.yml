x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  # The backend service has been intentionally removed from the compose
  # stack. Run the API server locally with `pnpm run dev` so you can
  # develop without rebuilding containers. The compose stack below
  # contains all dependencies needed for the student panel.

  # Main PostgreSQL database for the application
  postgres:
    image: postgres:16.2
    env_file:
      - .env
    environment:
      POSTGRES_DB: codeethnics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeethnics"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # Redis for caching, rate limiting, and job queues
  redis:
    image: redis:7.2.4-alpine
    env_file:
      - .env
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "noeviction",
      "--requirepass", "${REDIS_PASSWORD:-redis_default}"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6380:6379"
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # Judge0 API server for DSA code execution
  judge0-server:
    image: mrkushalsm/judge0:cgv2
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    env_file:
      - judge0.conf
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=2N6TXZac7z5aYmRqH5FmhqNyAVJt5r4f
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/about"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # Judge0 workers for processing code execution
  judge0-workers:
    image: mrkushalsm/judge0:cgv2
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    env_file:
      - judge0.conf
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=2N6TXZac7z5aYmRqH5FmhqNyAVJt5r4f
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # PostgreSQL database for Judge0
  judge0-db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: 2N6TXZac7z5aYmRqH5FmhqNyAVJt5r4f
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # Redis for Judge0 job queue
  judge0-redis:
    image: redis:7.2.4-alpine
    command: [
      "redis-server",
      "--appendonly", "no",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru",
      "--requirepass", "judge0secret"   # add this
    ]
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # Arduino compiler service for Arduino code compilation
  arduino-compiler:
    build:
      context: ./arduino-compiler
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=8080
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_default}@redis:6380/0
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/codeethnics?schema=public
      - NODE_ENV=development
      - ARDUINO_CLI_PATH=/usr/local/bin/arduino-cli
    volumes:
      - arduino_cache:/app/cache
      - /tmp/arduino-builds:/tmp/arduino-builds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "8080:8080"
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

  # Arduino job worker for processing compilation jobs
  arduino-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: arduino-worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_default}@redis:6380/0
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/codeethnics?schema=public
      - ARDUINO_COMPILER_URL=http://arduino-compiler:8080
      - CDN_API_KEY=${CDN_API_KEY:-}
      - CDN_API_SECRET=${CDN_API_SECRET:-}
      - NODE_ENV=development
    depends_on:
      arduino-compiler:
        condition: service_healthy
    <<: *default-logging
    restart: unless-stopped
    networks:
      - codeethnic-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  judge0_data:
    driver: local
  judge0_redis_data:
    driver: local
  arduino_cache:
    driver: local

networks:
  codeethnic-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
