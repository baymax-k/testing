<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions - CodeEthnics</title>
    <link rel="stylesheet" href="/test/css/modern-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-4);
            align-items: end;
        }
        
        .actions {
            display: flex;
            gap: var(--space-2);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-4);
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/test/dashboard.html" class="logo">CodeEthnics</a>
            <nav class="nav">
                <a href="/test/dashboard.html" class="nav-link">Dashboard</a>
                <a href="/test/problems.html" class="nav-link">Problems</a>
                <a href="/test/practice.html" class="nav-link">Practice</a>
                <a href="/test/arduino.html" class="nav-link">Arduino</a>
                <a href="/test/potd.html" class="nav-link">POTD</a>
                <a href="/test/contests.html" class="nav-link">Contests</a>
                <a href="/test/submissions.html" class="nav-link active">Submissions</a>
                <a href="/test/profile.html" class="nav-link">Profile</a>
                <a href="#" onclick="signOut()" class="nav-link">Sign Out</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <h1>Submissions</h1>
        <p>View and filter your code submissions across all problems.</p>
        
        <div class="card mb-6">
            <div class="card-header">
                <h3 class="card-title">Filters</h3>
                <p class="card-description">Filter submissions by various criteria</p>
            </div>
            <form id="filters" class="form-grid">
                <div class="form-group">
                    <label class="form-label">Problem Slug</label>
                    <input type="text" name="problemId" class="form-input" placeholder="e.g. two-sum">
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="">Any</option>
                        <option value="accepted">Accepted</option>
                        <option value="wrong_answer">Wrong Answer</option>
                        <option value="time_limit_exceeded">Time Limit</option>
                        <option value="memory_limit_exceeded">Memory Limit</option>
                        <option value="runtime_error">Runtime Error</option>
                        <option value="compilation_error">Compilation Error</option>
                        <option value="processing">Processing</option>
                        <option value="internal_error">Internal Error</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Language</label>
                    <input type="text" name="language" class="form-input" placeholder="e.g. javascript">
                </div>
                <div class="form-group">
                    <label class="form-label">From</label>
                    <input type="date" name="from" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">To</label>
                    <input type="date" name="to" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Limit</label>
                    <select name="limit" class="form-select">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Apply</button>
                    <button type="button" id="reset-filters" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>

        <div id="submissions-list">
            <div class="loading">
                <div class="spinner"></div>
                Loading submissions...
            </div>
        </div>

        <div id="pagination" class="pagination" style="display: none;">
            <button id="prev-page" class="btn btn-secondary">Previous</button>
            <span id="page-info" class="text-sm text-gray-600"></span>
            <button id="next-page" class="btn btn-secondary">Next</button>
        </div>
    </div>

    <script src="/test/js/utils.js"></script>
    <script>
        const state = { page: 1 };

        function buildQuery() {
            const form = document.getElementById('filters');
            const params = new URLSearchParams();

            const entries = new FormData(form);
            entries.forEach((value, key) => {
                if (value) params.append(key, value.toString());
            });

            params.set('page', String(state.page));
            return params.toString();
        }

        function renderSubmissions(result) {
            const container = document.getElementById('submissions-list');
            if (!result || result.status !== 200) {
                container.innerHTML = '<div class="alert alert-error">Failed to load submissions</div>';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            const items = result.data.submissions || [];
            if (!items.length) {
                container.innerHTML = '<div class="alert alert-info">No submissions found</div>';
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            const html = items.map((s) => {
                const problemTitle = s.problem?.title || s.problemId;
                const difficulty = s.problem?.difficulty ? getDifficultyBadge(s.problem.difficulty) : '';
                const tags = (s.problem?.tags || []).slice(0, 3).join(', ');
                return `
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">${problemTitle}</h3>
                            <div class="flex gap-2">
                                ${difficulty}
                                ${getStatusBadge(s.status)}
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-sm text-gray-600">
                            <span><strong>Language:</strong> ${s.language}</span>
                            <span>${formatDate(s.createdAt)}</span>
                        </div>
                        ${tags ? `<p class="text-sm text-gray-500 mt-2"><strong>Tags:</strong> ${tags}</p>` : ''}
                    </div>
                `;
            }).join('');

            container.innerHTML = html;

            const pagination = result.data.pagination;
            if (pagination) {
                document.getElementById('pagination').style.display = 'flex';
                document.getElementById('page-info').textContent = `Page ${pagination.page} of ${pagination.pages}`;
                document.getElementById('prev-page').disabled = pagination.page <= 1;
                document.getElementById('next-page').disabled = pagination.page >= pagination.pages;
            } else {
                document.getElementById('pagination').style.display = 'none';
            }
        }

        async function loadSubmissions() {
            if (!await checkAuth()) return;
            const query = buildQuery();
            const result = await fetchAPI(`/submissions?${query}`);
            renderSubmissions(result);
        }

        document.getElementById('filters').addEventListener('submit', (e) => {
            e.preventDefault();
            state.page = 1;
            loadSubmissions();
        });

        document.getElementById('reset-filters').addEventListener('click', () => {
            const form = document.getElementById('filters');
            form.reset();
            state.page = 1;
            loadSubmissions();
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (state.page > 1) {
                state.page -= 1;
                loadSubmissions();
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            state.page += 1;
            loadSubmissions();
        });

        loadSubmissions();
    </script>
</body>
</html>
